<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gráfico espelhado: desocupação por região e ano (razão com o Brasil)</title>
<style>
  :root { --bg:#faf7f2; --ink:#1f1d1a; --mut:#6b6459; --line:#e3ddd0; --acc:#2f6b4f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 'Helvetica Neue',Helvetica,Arial,sans-serif; }
  header { padding:12px 20px 10px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; }
  header h1 { font-size:16px; margin:0; font-weight:700; flex:1 1 380px; }
  .botoes { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  button { font:inherit; border:1px solid #b9b2a3; background:#fff; color:var(--ink); padding:5px 12px; border-radius:4px; cursor:pointer; }
  button:hover { border-color:var(--acc); }
  button[aria-pressed="true"] { background:#e3f3ea; border-color:var(--acc); font-weight:700; }
  #barra { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); padding:8px 20px; display:flex; flex-wrap:wrap; gap:8px 22px; align-items:center; }
  #barra .grupo { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; }
  #barra .rot { font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--mut); margin-right:2px; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; font-size:12px; border-radius:12px; border:1px solid #cfc8ba; background:#fff; cursor:pointer; user-select:none; }
  .chip[aria-pressed="true"] { border-color:var(--acc); background:#e3f3ea; font-weight:700; }
  .chip i { width:14px; height:9px; display:inline-block; border:1px solid rgba(0,0,0,.25); }
  #area-grafico { overflow:auto; padding:6px 12px 40px; }
  #area-grafico svg { display:block; background:var(--bg); }
  g.obs.dim { opacity:.1 !important; }
  @media print {
    body.imprimindo header, body.imprimindo #barra, body.imprimindo #aviso { display:none !important; }
    body.imprimindo { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    body.imprimindo #area-grafico { overflow:visible; padding:0; }
    body.imprimindo #area-grafico svg { margin:0; }
  }
</style>
<style id="pagina"></style>
</head>
<body>
<header>
  <h1>Desocupação no Brasil, 2016–2024: gráfico espelhado por região e ano</h1>
  <div class="botoes">
    <button id="b-ajustar" aria-pressed="true">Ajustar à largura</button>
    <button id="b-100" aria-pressed="false">100%</button>
    <button id="b-200" aria-pressed="false">200%</button>
    <button id="b-svg">Baixar SVG</button>
    <button id="b-pdf">Salvar PDF</button>
  </div>
</header>
<div id="barra">
  <div class="grupo" id="g-cores"><span class="rot">COR OU RAÇA</span></div>
  <div class="grupo" id="g-faixas"><span class="rot">FAIXA ETÁRIA</span></div>
  <button id="b-limpar" style="padding:2px 10px;font-size:12px">Limpar destaque</button>
</div>
<main id="area-grafico"></main>

<script>
/* Gráfico espelhado: grade região × ano (razão com a taxa do Brasil). */
(function (root) {
'use strict';

const ANOS = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024];
// ordem das linhas segue a imagem de referência (1.png)
const REGIOES = ['Centro-Oeste', 'Nordeste', 'Norte', 'Sudeste', 'Sul'];
const ESCOLARIDADES = ['Sem instrução e menos de 1 ano', 'Fundamental incompleto', 'Fundamental completo',
  'Médio incompleto', 'Médio completo', 'Superior incompleto', 'Superior completo'];
const FAIXAS = ['14–17', '18–24', '25–39', '40–59', '60 anos ou mais'];
const SEXOS = ['Homens', 'Mulheres'];
const CORES = ['Branca', 'Parda', 'Preta'];            // ordem de empilhamento: branco, pardo, preto

// Razão entre a taxa de desocupação da categoria e a taxa do Brasil, 2016 → 2024.
const HEAT = {
  esc: [
    [0.68, 0.74, 0.84, 0.73, 0.93, 0.69, 0.82, 0.82, 0.88],
    [0.95, 0.95, 0.93, 0.99, 1.08, 0.88, 0.92, 0.99, 0.94],
    [1.15, 1.18, 1.12, 1.19, 1.25, 1.00, 1.05, 1.27, 1.21],
    [1.79, 1.64, 1.70, 1.74, 1.75, 1.44, 1.59, 1.73, 1.64],
    [1.13, 1.10, 1.09, 1.09, 1.24, 1.03, 1.01, 1.10, 1.08],
    [1.21, 1.06, 1.07, 1.10, 1.21, 1.02, 0.95, 1.06, 1.09],
    [0.49, 0.47, 0.48, 0.50, 0.51, 0.45, 0.43, 0.45, 0.48]],
  faixa: [
    [0.66, 0.66, 0.67, 0.69, 0.48, 0.50, 0.64, 0.63, 0.67],
    [1.44, 1.46, 1.47, 1.49, 1.34, 1.31, 1.40, 1.45, 1.49],
    [0.73, 0.76, 0.75, 0.76, 0.72, 0.71, 0.72, 0.77, 0.78],
    [0.40, 0.43, 0.44, 0.44, 0.45, 0.45, 0.46, 0.49, 0.50],
    [0.07, 0.08, 0.09, 0.09, 0.07, 0.08, 0.09, 0.11, 0.11]],
  sexo: [
    [0.91, 0.89, 0.88, 0.86, 0.86, 0.79, 0.83, 0.83, 0.80],
    [1.18, 1.15, 1.16, 1.19, 1.12, 1.13, 1.21, 1.19, 1.23]],
  cor: {   // Branca e Parda de 2017 (índice 1) são dado externo (IBGE, 2º tri/2017)
    Branca: [0.81, 0.82, 0.81, 0.78, 0.75, 0.81, 0.76, 0.76, 0.83],
    Parda: [1.21, 1.20, 1.18, 1.15, 1.12, 1.16, 1.13, 1.14, 1.18],
    Preta: [1.23, 1.25, 1.23, 1.26, 1.29, 1.18, 1.18, 1.23, 1.29]},
  reg: {
    'Norte': [0.98, 0.98, 0.99, 1.01, 0.91, 0.93, 0.93, 0.99, 1.05],
    'Nordeste': [1.18, 1.19, 1.21, 1.24, 1.17, 1.18, 1.32, 1.38, 1.42],
    'Sudeste': [1.09, 1.06, 1.08, 1.02, 1.01, 1.02, 0.97, 0.96, 1.00],
    'Sul': [0.68, 0.63, 0.67, 0.69, 0.64, 0.55, 0.58, 0.59, 0.71],
    'Centro-Oeste': [0.93, 0.77, 0.80, 0.86, 0.91, 0.74, 0.73, 0.71, 0.82]}
};
const EXTERNO = (cor, a) => (cor === 'Branca' || cor === 'Parda') && ANOS[a] === 2017;

const COR_BARRA = { Branca: '#ffffff', Parda: '#8b5e1a', Preta: '#111111' };
const VERMELHOS = ['#e8171b', '#f2605b', '#f78d86', '#fbb2ab', '#fdd3cd'];   // 14–17 (forte) → 60+ (claro)
const BG = '#faf7f2', TXT = '#1f1d1a', TXT2 = '#6b6459', VERDE = '#d9f4e3', VERDE_FORTE = '#6cc994', LADO_H = '#e8eef9', LADO_M = '#f9e8ef', FONTE = "'Helvetica Neue', Helvetica, Arial, sans-serif";

const G = { Wp: 150, colGap: 30, leftW: 235, rowH: 52, rowGap: 12, strip: 34, regGap: 64, headTop: 282 };
G.panelH = G.strip + ESCOLARIDADES.length * G.rowH + (ESCOLARIDADES.length - 1) * G.rowGap;
G.pitch = 2 * G.Wp + G.colGap;

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const f2 = v => v.toFixed(2).replace('.', ',');
const n1 = v => Math.round(v * 100) / 100;

function valores() {
  // devolve função que entrega os valores de cada elemento
  return {
    banda: (r, a, e, s) => HEAT.reg[REGIOES[r]][a] * HEAT.esc[e][a] * HEAT.sexo[s][a],
    cor: (r, a, e, s, c) => HEAT.reg[REGIOES[r]][a] * HEAT.esc[e][a] * HEAT.sexo[s][a] * HEAT.cor[CORES[c]][a],
    faixa: (r, a, e, s, f) => HEAT.reg[REGIOES[r]][a] * HEAT.esc[e][a] * HEAT.sexo[s][a] * HEAT.faixa[f][a]
  };
}

function maximo() {
  const v = valores(); let m = 0;
  for (let r = 0; r < 5; r++) for (let a = 0; a < 9; a++) for (let e = 0; e < 7; e++) for (let s = 0; s < 2; s++) {
    m = Math.max(m, v.banda(r, a, e, s));
    for (let c = 0; c < 3; c++) m = Math.max(m, v.cor(r, a, e, s, c));
    for (let f = 0; f < 5; f++) m = Math.max(m, v.faixa(r, a, e, s, f));
  }
  for (let a = 0; a < 9; a++) for (let r = 0; r < 5; r++) m = Math.max(m, HEAT.reg[REGIOES[r]][a]);
  return m;
}

function chaveBrace(x, y1, y2, w) {
  const m = (y1 + y2) / 2, r = 30, h = w / 2;   // abre para a direita; ponta à esquerda
  return 'M' + (x + w) + ',' + y1 + ' C' + (x + h * 1.45) + ',' + y1 + ' ' + (x + h) + ',' + (y1 + r * .45) + ' ' + (x + h) + ',' + (y1 + r) +
    ' L' + (x + h) + ',' + (m - r) + ' C' + (x + h) + ',' + (m - r * .45) + ' ' + (x + h * .55) + ',' + m + ' ' + x + ',' + m +
    ' C' + (x + h * .55) + ',' + m + ' ' + (x + h) + ',' + (m + r * .45) + ' ' + (x + h) + ',' + (m + r) +
    ' L' + (x + h) + ',' + (y2 - r) + ' C' + (x + h) + ',' + (y2 - r * .45) + ' ' + (x + h * 1.45) + ',' + y2 + ' ' + (x + w) + ',' + y2;
}
function quebrar(txt, max) {
  const out = []; let at = '';
  txt.split(' ').forEach(p => { if ((at + ' ' + p).trim().length > max && at) { out.push(at); at = p; } else at = (at + ' ' + p).trim(); });
  if (at) out.push(at); return out;
}

function construirSVG() {
  const V = valores();
  const maxV = maximo();
  const nice = Math.ceil(maxV * 2) / 2;
  const k = G.Wp / nice;
  const x0 = G.leftW + 20;
  const xFimPaineis = x0 + 9 * G.pitch - G.colGap;
  const xLab = xFimPaineis + 22;
  const largura = Math.round(xLab + 215);
  const altura = Math.round(G.headTop + 50 + 5 * G.panelH + 4 * G.regGap + 90);
  const o = [];
  const T = (x, y, t, size, w, fill, anchor, extra) => '<text x="' + n1(x) + '" y="' + n1(y) + '" font-size="' + size + '" font-weight="' + (w || 400) +
    '" fill="' + (fill || TXT) + '"' + (anchor ? ' text-anchor="' + anchor + '"' : '') + (extra || '') + '>' + esc(t) + '</text>';
  const barra = (s, cx, len, y, h, fill, stroke, titulo, grupo, dash) =>
    '<g class="obs" data-g="' + grupo + '"><title>' + esc(titulo) + '</title><rect x="' + n1(s === 0 ? cx - len : cx) + '" y="' + n1(y) + '" width="' + n1(len) +
    '" height="' + h + '" fill="' + fill + '"' + (stroke ? ' stroke="' + stroke + '" stroke-width=".6"' : '') + (dash ? ' stroke-dasharray="1.8 1.3"' : '') + '/></g>';

  o.push('<svg xmlns="http://www.w3.org/2000/svg" width="' + largura + '" height="' + altura + '" viewBox="0 0 ' + largura + ' ' + altura +
    '" font-family="' + FONTE + '" role="img" aria-label="Gráfico espelhado da desocupação por região e ano">');
  o.push('<title>Desocupação por região, escolaridade, faixa etária, cor ou raça e sexo, 2016–2024 (razão com o Brasil)</title>');
  o.push('<rect width="' + largura + '" height="' + altura + '" fill="' + BG + '"/>');

  o.push(T(40, 46, 'Desocupação no Brasil, 2016–2024: razão com a taxa nacional por região, escolaridade, faixa etária, cor ou raça e sexo', 22, 700));
  o.push(T(40, 70, '1,0× = taxa de desocupação do Brasil no ano (linha tracejada). Esquerda do eixo = Homens, direita = Mulheres, mesma escala em todos os painéis.', 11.5, 400, TXT2));

  // legenda
  let ly = 124;
  o.push(T(40, ly, 'COR OU RAÇA', 11, 700));
  [['PARDO', 'Parda'], ['BRANCO', 'Branca'], ['PRETO', 'Preta']].forEach(([nome, c], i) => {
    const x = 40 + i * 110;
    o.push('<rect x="' + x + '" y="' + (ly + 8) + '" width="24" height="12" fill="' + COR_BARRA[c] + '" stroke="' + (c === 'Branca' ? '#555' : 'none') + '" stroke-width=".8"/>');
    o.push(T(x + 32, ly + 18, nome, 11, 400, TXT, null, ' text-decoration="underline"'));
  });
  o.push(T(400, ly, 'GRADIENTE FAIXA ETÁRIA', 11, 700));
  ['14–17', '18–24', '25–39', '40–59', '60+'].forEach((nome, i) => {
    const x = 400 + i * 78;
    o.push('<rect x="' + x + '" y="' + (ly + 8) + '" width="24" height="12" fill="' + VERMELHOS[i] + '"/>');
    o.push(T(x + 30, ly + 18, nome, 11, 400, TXT, null, ' text-decoration="underline"'));
  });
  ly += 52;
  o.push('<rect x="40" y="' + (ly - 4) + '" width="20" height="14" fill="' + VERDE + '" stroke="' + TXT + '" stroke-width=".8"/>' +
    '<rect x="60" y="' + (ly - 4) + '" width="20" height="14" fill="' + VERDE_FORTE + '" stroke="' + TXT + '" stroke-width=".8"/>');
  o.push(T(90, ly + 8, 'faixa verde = escolaridade; trecho verde forte = parte acima da taxa do Brasil (1,0×)', 11, 400, TXT2));
  o.push('<line x1="560" x2="598" y1="' + (ly + 3) + '" y2="' + (ly + 3) + '" stroke="#6b6459" stroke-width="1" stroke-dasharray="3 2.5"/>');
  o.push(T(606, ly + 8, '1,0× (taxa do Brasil)', 11, 400, TXT2));
  ly += 30;
  o.push('<rect x="40" y="' + (ly - 4) + '" width="38" height="3.4" fill="#8b5e1a" stroke="' + TXT + '" stroke-width=".6" stroke-dasharray="1.8 1.3"/>');
  o.push(T(88, ly + 3, '† 2017, Branca e Parda: dado externo (IBGE, 2º tri/2017)', 11, 400, TXT2));
  o.push('<rect x="560" y="' + (ly - 8) + '" width="20" height="14" fill="' + LADO_H + '" stroke="#c9d3e8" stroke-width=".6"/><rect x="580" y="' + (ly - 8) + '" width="20" height="14" fill="' + LADO_M + '" stroke="#e8c9d6" stroke-width=".6"/>');
  o.push(T(608, ly + 3, 'fundo azulado = Homens; fundo rosado = Mulheres', 11, 400, TXT2));
  ly += 26;
  o.push('<rect x="40" y="' + (ly - 6) + '" width="38" height="5" fill="#111"/><rect x="40" y="' + (ly + 2) + '" width="38" height="5" fill="#7d776b"/>');
  o.push(T(88, ly + 4, 'faixa superior de cada painel: barra preta = região; barra cinza = sexo (valores escritos nas pontas)', 11, 400, TXT2));

  // esquema de leitura de um painel (comprimentos iguais: não são dados)
  const ex = 1130, ey = 104;
  o.push(T(ex, ey, 'ESQUEMA DE LEITURA (comprimentos iguais, não são dados)', 11, 700));
  o.push('<rect x="' + (ex + 20) + '" y="' + (ey + 6) + '" width="80" height="62" fill="' + LADO_H + '"/><rect x="' + (ex + 100) + '" y="' + (ey + 6) + '" width="80" height="62" fill="' + LADO_M + '"/>');
  o.push('<rect x="' + (ex + 40) + '" y="' + (ey + 18) + '" width="120" height="48" fill="' + VERDE + '" stroke="' + TXT + '" stroke-width=".8"/>');
  const ang = [['Branca', 0], ['Parda', 1], ['Preta', 2]];
  ang.forEach(([n, i]) => {
    o.push('<rect x="' + (ex + 50) + '" y="' + (ey + 21 + i * 5) + '" width="100" height="4" fill="' + COR_BARRA[n] + '" stroke="' + (n === 'Branca' ? '#555' : 'none') + '" stroke-width=".6"/>');
    o.push(T(ex + 190, ey + 25 + i * 5, n, 8.5, 400, TXT2));
  });
  VERMELHOS.forEach((c, i) => o.push('<rect x="' + (ex + 50) + '" y="' + (ey + 38 + i * 5.4) + '" width="100" height="4.2" fill="' + c + '"/>'));
  o.push(T(ex + 190, ey + 52, 'faixas etárias (14–17 … 60+)', 8.5, 400, TXT2));
  o.push('<rect x="' + (ex + 20) + '" y="' + (ey + 7) + '" width="160" height="4" fill="#111"/><rect x="' + (ex + 20) + '" y="' + (ey + 12.5) + '" width="160" height="3" fill="#7d776b" opacity=".0"/>');
  o.push(T(ex + 190, ey + 12, 'região / sexo (topo)', 8.5, 400, TXT2));
  o.push('<line x1="' + (ex + 100) + '" x2="' + (ex + 100) + '" y1="' + (ey + 2) + '" y2="' + (ey + 72) + '" stroke="#222" stroke-width="1.4"/>');
  o.push(T(ex + 100, ey + 84, 'Homens ◄  ► Mulheres', 9, 400, TXT2, 'middle'));

  // cabeçalho: anos
  const yH = G.headTop;
  ANOS.forEach((a, i) => {
    const cx = x0 + i * G.pitch + G.Wp;
    o.push(T(cx, yH, String(a), 16, 700, TXT, 'middle'));
    o.push(T(cx - 8, yH + 19, 'HOMENS', 10.5, 700, '#2f4f8f', 'end'));
    o.push(T(cx + 8, yH + 19, 'MULHERES', 10.5, 700, '#9b2c5e', 'start'));
  });
  o.push('<line x1="' + (x0 - 12) + '" x2="' + (xFimPaineis + 12) + '" y1="' + (yH + 30) + '" y2="' + (yH + 30) + '" stroke="#4a463f" stroke-width=".9"/>');

  REGIOES.forEach((reg, r) => {
    const ptop = yH + 50 + r * (G.panelH + G.regGap);
    const pbot = ptop + G.panelH;
    if (r > 0) o.push('<line x1="' + (x0 - 12) + '" x2="' + (xFimPaineis + 12) + '" y1="' + n1(ptop - G.regGap / 2) + '" y2="' + n1(ptop - G.regGap / 2) + '" stroke="#d6cfc0" stroke-width=".8"/>');
    ANOS.forEach((ano, a) => {
      const cx = x0 + a * G.pitch + G.Wp;
      // fundo por sexo, linha de referência e eixo central
      o.push('<rect x="' + (cx - G.Wp) + '" y="' + (ptop - 6) + '" width="' + G.Wp + '" height="' + (G.panelH + 12) + '" fill="' + LADO_H + '"/>');
      o.push('<rect x="' + cx + '" y="' + (ptop - 6) + '" width="' + G.Wp + '" height="' + (G.panelH + 12) + '" fill="' + LADO_M + '"/>');
      if (nice >= 1) [-1, 1].forEach(sg => o.push('<line x1="' + n1(cx + sg * k) + '" x2="' + n1(cx + sg * k) + '" y1="' + (ptop - 6) + '" y2="' + (pbot + 6) + '" stroke="#6b6459" stroke-width=".9" stroke-dasharray="3 2.5"/>'));
      o.push('<line x1="' + cx + '" x2="' + cx + '" y1="' + (ptop - 8) + '" y2="' + (pbot + 8) + '" stroke="#222" stroke-width="1.8"/>');

      // faixa superior: região (preta, simétrica) e sexo (cinza, espelhada), com valores escritos
      const vr = HEAT.reg[reg][a];
      const tRegiao = reg + ', ' + ano + ': ' + f2(vr) + '× a taxa do Brasil';
      o.push(barra(0, cx, vr * k, ptop + 2, 6, '#111', null, tRegiao, 'regiao'));
      o.push(barra(1, cx, vr * k, ptop + 2, 6, '#111', null, tRegiao, 'regiao'));
      o.push(T(cx + vr * k + 4, ptop + 8, f2(vr), 9, 700, TXT, 'start'));
      o.push(T(cx - vr * k - 4, ptop + 8, f2(vr), 9, 700, TXT, 'end'));
      for (let s = 0; s < 2; s++) {
        const vs = HEAT.sexo[s][a];
        o.push(barra(s, cx, vs * k, ptop + 14, 6, s === 0 ? '#3f5f9a' : '#b03a6e', null, SEXOS[s] + ', ' + ano + ': ' + f2(vs) + '× a taxa do Brasil', 'sexo'));
        o.push(T(cx + (s === 0 ? -1 : 1) * (vs * k + 4), ptop + 20, f2(vs), 9, 700, s === 0 ? '#2f4f8f' : '#9b2c5e', s === 0 ? 'end' : 'start'));
      }
      // linhas de escolaridade
      for (let e = 0; e < 7; e++) {
        const rt = ptop + G.strip + e * (G.rowH + G.rowGap);
        for (let s = 0; s < 2; s++) {
          const vb = V.banda(r, a, e, s);
          const fat = f2(HEAT.reg[reg][a]) + ' (' + reg + ') × ' + f2(HEAT.esc[e][a]) + ' (' + ESCOLARIDADES[e] + ') × ' + f2(HEAT.sexo[s][a]) + ' (' + SEXOS[s] + ')';
          const ctx = reg + ' · ' + ano + ' · ' + ESCOLARIDADES[e] + ' · ' + SEXOS[s];
          const sg = s === 0 ? -1 : 1;
          const baseLen = Math.min(vb, 1) * k;
          let band = '<g class="obs" data-g="banda"><title>' + esc(ctx + '\nFaixa de escolaridade: ' + f2(vb) + '×\n= ' + fat) + '</title>' +
            '<rect x="' + n1(s === 0 ? cx - baseLen : cx) + '" y="' + n1(rt) + '" width="' + n1(baseLen) + '" height="' + G.rowH + '" fill="' + VERDE + '"/>';
          if (vb > 1) band += '<rect x="' + n1(s === 0 ? cx - vb * k : cx + k) + '" y="' + n1(rt) + '" width="' + n1((vb - 1) * k) + '" height="' + G.rowH + '" fill="' + VERDE_FORTE + '"/>';
          band += '<rect x="' + n1(s === 0 ? cx - vb * k : cx) + '" y="' + n1(rt) + '" width="' + n1(vb * k) + '" height="' + G.rowH + '" fill="none" stroke="' + TXT + '" stroke-width=".9"/></g>';
          o.push(band);
          // cor ou raça
          for (let c = 0; c < 3; c++) {
            const v = V.cor(r, a, e, s, c), cn = CORES[c], ext = EXTERNO(cn, a);
            const fx = fat + ' × ' + f2(HEAT.cor[cn][a]) + ' (' + cn + (ext ? ' †' : '') + ')';
            o.push(barra(s, cx, v * k, rt + 4 + c * 6.6, 5.4, COR_BARRA[cn], cn === 'Branca' ? '#444' : (ext ? '#000' : null),
              ctx + '\n' + cn + ': ' + f2(v) + '×\n= ' + fx, 'c' + c, ext));
          }
          // faixa etária
          for (let f = 0; f < 5; f++) {
            const v = V.faixa(r, a, e, s, f);
            const fx = fat + ' × ' + f2(HEAT.faixa[f][a]) + ' (' + FAIXAS[f] + ')';
            o.push(barra(s, cx, v * k, rt + 27 + f * 4.4, 3.6, VERMELHOS[f], '#b23a33', ctx + '\nFaixa etária ' + FAIXAS[f] + ': ' + f2(v) + '×\n= ' + fx, 'f' + f));
          }
        }
      }
    });
    // rótulos de escolaridade (à direita) e chave da região (à esquerda)
    for (let e = 0; e < 7; e++) {
      const rt = ptop + G.strip + e * (G.rowH + G.rowGap), mid = rt + G.rowH / 2;
      const ls = quebrar(ESCOLARIDADES[e].toUpperCase(), 22);
      ls.forEach((ln, i) => o.push(T(xLab, mid + 4 + (i - (ls.length - 1) / 2) * 14, ln, 11.5, 400, TXT, null, ' text-decoration="underline"')));
    }
    const bx = G.leftW - 48, my = (ptop + G.strip + pbot) / 2;
    o.push('<path d="' + chaveBrace(bx, ptop + G.strip, pbot, 26) + '" fill="none" stroke="#111" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>');
    const parts = ('REGIÃO ' + reg.toUpperCase().replace('-', ' ')).split(' ');
    o.push(T(bx - 12, my - 2, parts[0], 15, 400, TXT, 'end'));
    o.push(T(bx - 12, my + 17, parts.slice(1).join(' '), 15, 400, TXT, 'end'));
  });

  const fy = altura - 56;
  o.push(T(40, fy, 'Passe o mouse sobre uma barra para ver o produto e cada razão usada.', 11, 400, TXT2));
  o.push('</svg>');
  return { svg: o.join(''), largura, altura, nice };
}

const API = { ANOS, REGIOES, ESCOLARIDADES, FAIXAS, SEXOS, CORES, HEAT, VERMELHOS, COR_BARRA, construirSVG, maximo, G };
if (typeof module !== 'undefined' && module.exports) module.exports = API; else root.GraficoEspelhado = API;
})(typeof window !== 'undefined' ? window : globalThis);

<script>
(function () {
  'use strict';
  const G = window.GraficoEspelhado;
  const area = document.getElementById('area-grafico');
  let resultado = null, zoom = 'fit';
  const sel = new Set();

  const rotCor = ['Branca', 'Parda', 'Preta'];
  const gc = document.getElementById('g-cores'), gf = document.getElementById('g-faixas');
  rotCor.forEach((c, i) => {
    const b = document.createElement('span'); b.className = 'chip'; b.tabIndex = 0; b.setAttribute('role', 'button'); b.setAttribute('aria-pressed', 'false');
    b.dataset.g = 'c' + i; b.innerHTML = '<i style="background:' + G.COR_BARRA[c] + '"></i>' + c; gc.appendChild(b);
  });
  ['14–17', '18–24', '25–39', '40–59', '60+'].forEach((f, i) => {
    const b = document.createElement('span'); b.className = 'chip'; b.tabIndex = 0; b.setAttribute('role', 'button'); b.setAttribute('aria-pressed', 'false');
    b.dataset.g = 'f' + i; b.innerHTML = '<i style="background:' + G.VERMELHOS[i] + '"></i>' + f; gf.appendChild(b);
  });
  function alternar(el) {
    const g = el.dataset.g; if (sel.has(g)) sel.delete(g); else sel.add(g);
    el.setAttribute('aria-pressed', sel.has(g) ? 'true' : 'false'); destacar();
  }
  const barra = document.getElementById('barra');
  barra.addEventListener('click', e => { const c = e.target.closest('.chip'); if (c) alternar(c); });
  barra.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('chip')) { e.preventDefault(); alternar(e.target); } });
  document.getElementById('b-limpar').onclick = () => { sel.clear(); document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false')); destacar(); };
  function destacar() {
    area.querySelectorAll('g.obs').forEach(g => g.classList.toggle('dim', sel.size > 0 && !sel.has(g.dataset.g)));
  }

  function aplicarZoom() {
    const svg = area.querySelector('svg'); if (!svg || !resultado) return;
    const w = zoom === 'fit' ? Math.max(900, area.clientWidth - 24) : resultado.largura * zoom;
    svg.style.width = w + 'px'; svg.style.height = (w * resultado.altura / resultado.largura) + 'px';
    [['b-ajustar', 'fit'], ['b-100', 1], ['b-200', 2]].forEach(([id, z]) => document.getElementById(id).setAttribute('aria-pressed', String(zoom === z)));
  }
  [['b-ajustar', 'fit'], ['b-100', 1], ['b-200', 2]].forEach(([id, z]) => { document.getElementById(id).onclick = () => { zoom = z; aplicarZoom(); }; });
  window.addEventListener('resize', () => { if (zoom === 'fit') aplicarZoom(); });

  function desenhar() {
    resultado = G.construirSVG();
    area.innerHTML = resultado.svg;
    aplicarZoom(); destacar();
  }

  document.getElementById('b-svg').onclick = () => {
    const blob = new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n' + resultado.svg], { type: 'image/svg+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'grafico_espelhado_regiao_ano_combinado.svg';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  document.getElementById('b-pdf').onclick = () => {
    document.getElementById('pagina').textContent = '@page { size: ' + resultado.largura + 'px ' + resultado.altura + 'px; margin: 0; }' +
      '@media print { body.imprimindo #area-grafico svg { width:' + resultado.largura + 'px !important; height:' + resultado.altura + 'px !important; } }';
    document.body.classList.add('imprimindo');
    const fim = () => { document.body.classList.remove('imprimindo'); document.getElementById('pagina').textContent = ''; window.removeEventListener('afterprint', fim); };
    window.addEventListener('afterprint', fim);
    alert('Na janela de impressão, escolha “Salvar como PDF”, deixe as margens em “Nenhuma” e ative “Gráficos de segundo plano”.');
    window.print();
  };
  desenhar();
})();
</script>
